[package]
name = "rolandc-cli"
version = "0.1.0"
authors = ["Richard McCormack <brick@brick.codes>"]
edition = "2024"

[dependencies]
pico-args = { version = "0.5", default-features=false, features=[] }
rolandc = { path = "../rolandc" }
dhat = { version = "0.3", optional = true }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libwild = "0.10"
nix = "0.31"

[target.'cfg(target_os = "freebsd")'.dependencies]
nix = "0.31"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "*"

[features]
dhat-heap = ["dep:dhat"]
